[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schema-recovery"
version = "0.1.0"
description = "Workload-grounded schema recovery"
requires-python = ">=3.12"
dependencies = [
  "httpx==0.28.1",
  "json-repair==0.61.7",
  "numpy==2.5.1",
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
  "sqlglot==30.14.0",
]

[project.optional-dependencies]
retrieval = ["FlagEmbedding==1.4.0", "torch==2.9.0", "transformers==4.57.6", "sentence-transformers==5.6.0"]
mysql = ["mysql-connector-python>=9,<10"]

[tool.setuptools.packages.find]
where = ["src"]
